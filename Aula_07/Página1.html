<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da velha</title>
</head>
<body>
    <div id="paginaselecao">
    <h1>jogo da Velha</h1>

              <div class="campo-jogador">
            <input type="text" id="nomeJogador1" placeholder="Nome do Jogador 1">
            <button class="btn-simbolo" id="j1-X" data-jogador="1" data-simbolo="X">X</button>
            <button class="btn-simbolo" id="j1-O" data-jogador="1" data-simbolo="O">O</button>
        </div>

        <div class="campo-jogador">
            <input type="text" id="nomeJogador2" placeholder="Nome do Jogador 2">
            <button class="btn-simbolo" id="j2-X" data-jogador="2" data-simbolo="X">X</button>
            <button class="btn-simbolo" id="j2-O" data-jogador="2" data-simbolo="O">O</button>
        </div>
           <button id="botaoComecar">Começar Jogo</button>
    </div>
</body>
</html>
